services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-signature-db
    environment:
      POSTGRES_DB: digitalsignature
      POSTGRES_USER: ds_user
      POSTGRES_PASSWORD: ds_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds_user -d digitalsignature"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    container_name: digital-signature-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=digitalsignature;Username=ds_user;Password=ds_password"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "digital-signature-platform"
      Jwt__Audience: "digital-signature-platform"
      Jwt__ExpiryMinutes: "60"
      Aes__MasterKey: "${AES_MASTER_KEY}"
      Storage__BasePath: "/app/storage"
    volumes:
      - document_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    container_name: digital-signature-web
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  document_storage:
