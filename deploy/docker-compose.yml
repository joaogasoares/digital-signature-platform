services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-signature-db
    environment:
      POSTGRES_DB: digitalsignature
      POSTGRES_USER: ds_user
      POSTGRES_PASSWORD: ds_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds_user -d digitalsignature"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
