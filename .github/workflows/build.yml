name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Restore
        run: dotnet restore DigitalSignature.slnx

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin `
            /k:"joaogasoares_digital-signature-platform" `
            /o:"joaogasoares" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/AssemblyInfo.cs" `
            /d:sonar.exclusions="**/appsettings.Testing.json,**/Migrations/**"

          dotnet build DigitalSignature.slnx --no-restore --configuration Release

          dotnet test tests/DigitalSignature.Domain.UnitTests/DigitalSignature.Domain.UnitTests.csproj `
            --no-build --configuration Release `
            --collect:"XPlat Code Coverage" `
            --results-directory ./coverage/domain `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          dotnet test tests/DigitalSignature.Application.UnitTests/DigitalSignature.Application.UnitTests.csproj `
            --no-build --configuration Release `
            --collect:"XPlat Code Coverage" `
            --results-directory ./coverage/application `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          dotnet test tests/DigitalSignature.Infrastructure.IntegrationTests/DigitalSignature.Infrastructure.IntegrationTests.csproj `
            --no-build --configuration Release `
            --collect:"XPlat Code Coverage" `
            --results-directory ./coverage/infra `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          dotnet test tests/DigitalSignature.ArchitectureTests/DigitalSignature.ArchitectureTests.csproj `
            --no-build --configuration Release `
            --results-directory ./coverage/arch

          ${{ runner.temp }}\scanner\dotnet-sonarscanner end `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"