name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DigitalSignature.slnx

      - name: Build
        run: dotnet build DigitalSignature.slnx --no-restore --configuration Release

      - name: Unit Tests (no Docker required)
        run: |
          dotnet test tests/DigitalSignature.Domain.UnitTests \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/domain
          dotnet test tests/DigitalSignature.Application.UnitTests \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/application
          dotnet test tests/DigitalSignature.ArchitectureTests \
            --no-build --configuration Release \
            --results-directory ./coverage/arch

      - name: Integration Tests (Docker available on ubuntu runner)
        run: |
          dotnet test tests/DigitalSignature.Infrastructure.IntegrationTests \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/infra
          dotnet test tests/DigitalSignature.Api.IntegrationTests \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/api

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"Cobertura;Html"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report

      - name: Check Coverage (Domain + Application >= 80%)
        run: |
          DOMAIN_COVERAGE=$(grep -oP 'line-rate="\K[^"]+' coverage/domain/**/coverage.cobertura.xml 2>/dev/null | head -1 || echo "0")
          APP_COVERAGE=$(grep -oP 'line-rate="\K[^"]+' coverage/application/**/coverage.cobertura.xml 2>/dev/null | head -1 || echo "0")
          echo "Domain coverage: $DOMAIN_COVERAGE"
          echo "Application coverage: $APP_COVERAGE"
