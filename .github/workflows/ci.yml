name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DigitalSignature.slnx

      - name: Build
        run: dotnet build DigitalSignature.slnx --no-restore --configuration Release

      # ── Unit tests (no Docker) ────────────────────────────────────────
      - name: Unit Tests
        run: |
          dotnet test tests/DigitalSignature.Domain.UnitTests \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/domain
          dotnet test tests/DigitalSignature.Application.UnitTests \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/application
          dotnet test tests/DigitalSignature.ArchitectureTests \
            --no-build --configuration Release \
            --results-directory ./coverage/arch

      # ── Integration tests (Docker is available on ubuntu-latest) ─────
      - name: Integration Tests
        run: |
          dotnet test tests/DigitalSignature.Infrastructure.IntegrationTests \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/infra
          dotnet test tests/DigitalSignature.Api.IntegrationTests \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/api
        env:
          # ApiFactory uses appsettings.Testing.json for Jwt config
          ASPNETCORE_ENVIRONMENT: Testing

      # ── Coverage report ───────────────────────────────────────────────
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"Cobertura;Html;SonarQube"

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report

      # ── SonarQube / SonarCloud analysis ──────────────────────────────
      # Requires: SONAR_TOKEN secret, SONAR_HOST_URL (or SonarCloud org)
      - name: Install dotnet-sonarscanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Begin
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet sonarscanner begin \
            /k:"digital-signature-platform" \
            /o:"${{ vars.SONAR_ORG }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}" \
            /d:sonar.cs.opencover.reportsPaths="./coverage/**/coverage.cobertura.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs" \
            /d:sonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build for SonarQube
        if: env.SONAR_TOKEN != ''
        run: dotnet build DigitalSignature.slnx --configuration Release
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube End
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
